<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ماسح الحضور الذكي</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; padding: 10px; text-align: center; }
    .container { max-width: 460px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    
    .video-wrapper {
      position: relative; width: 100%; border-radius: 12px; overflow: hidden;
      background: #000; margin-bottom: 10px; height: 240px;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    .scan-guide {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90%; height: 50%; border: 2px solid #00e676;
      border-radius: 8px; box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4); pointer-events: none;
    }
    .laser {
      position: absolute; width: 100%; height: 2px; background: #00e676;
      box-shadow: 0 0 8px #00e676; animation: scanAnim 2s infinite ease-in-out;
    }
    @keyframes scanAnim {
      0% { top: 10%; opacity: 0.3; } 50% { top: 90%; opacity: 1; } 100% { top: 10%; opacity: 0.3; }
    }

    /* زر التقاط صورة بدقة عالية للبطاقة */
    .btn-capture {
      width: 100%; padding: 12px; background: #0288d1; color: #fff; border: none;
      border-radius: 9px; font-size: 1rem; font-weight: bold; cursor: pointer;
      margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    #status-alert {
      display: none; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; font-size: 0.95rem;
      background: #d4edda; color: #155724; border: 1px solid #c3e6cb;
    }

    .manual-box { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1; padding: 11px; border: 1.5px solid #dcdfe6; border-radius: 8px;
      font-size: 1rem; text-align: center; outline: none;
    }
    input[type="text"]:focus { border-color: #1f4e79; }
    .btn-add {
      background: #1f4e79; color: #fff; border: none; padding: 0 16px;
      border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    
    .counter { font-size: 1.1rem; font-weight: bold; color: #1f4e79; margin-bottom: 8px; }
    .list-box {
      max-height: 120px; overflow-y: auto; background: #fafafa;
      border: 1px solid #ebeef5; border-radius: 8px; padding: 6px; margin-bottom: 12px;
      text-align: right;
    }
    .student-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 0.95rem;
    }
    .del-btn { color: #d32f2f; cursor: pointer; font-weight: bold; padding: 0 5px; }
    
    .btn-submit {
      width: 100%; padding: 14px; background: #2e7d32; color: #fff;
      border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:disabled { background: #b0bec5; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <div id="status-alert"></div>

  <!-- الكاميرا المباشرة -->
  <div class="video-wrapper">
    <video id="video" playsinline webkit-playsinline muted autoplay></video>
    <div class="scan-guide"><div class="laser"></div></div>
  </div>

  <!-- خيار التصوير المباشر فائق الوضوح للبطاقات الصعبة -->
  <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" onchange="handleImageCapture(this)">
  <button class="btn-capture" onclick="document.getElementById('fileInput').click()">
    📸 تصوير البطاقة مباشرة (إذا تعذر المسح التلقائي)
  </button>

  <!-- الإدخال اليدوي -->
  <div class="manual-box">
    <input type="text" id="manualInput" placeholder="أدخل الرقم الأكاديمي يدوياً..." inputmode="numeric">
    <button class="btn-add" onclick="addManualStudent()">➕ إضافة</button>
  </div>

  <div class="counter">إجمالي الحاضرين: <span id="count">0</span></div>

  <div class="list-box" id="studentsList">
    <div style="color: #909399; text-align: center; padding: 8px;">لم يُسجل أي طالب بعد</div>
  </div>

  <button id="submitBtn" class="btn-submit" onclick="submitAttendance()" disabled>✅ إنهاء واعتماد الحضور</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let attendedStudents = new Set();
  let isCooldown = false;
  let codeReader = null;

  function showAlert(msg) {
    const el = document.getElementById("status-alert");
    el.innerText = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 1800);
  }

  function updateUI() {
    const listEl = document.getElementById("studentsList");
    const countEl = document.getElementById("count");
    const submitBtn = document.getElementById("submitBtn");

    countEl.innerText = attendedStudents.size;

    if (attendedStudents.size === 0) {
      listEl.innerHTML = `<div style="color: #909399; text-align: center; padding: 8px;">لم يُسجل أي طالب بعد</div>`;
      submitBtn.disabled = true;
    } else {
      listEl.innerHTML = "";
      attendedStudents.forEach(id => {
        const item = document.createElement("div");
        item.className = "student-item";
        item.innerHTML = `<span>🎓 الرقم: <b>${id}</b></span><span class="del-btn" onclick="removeStudent('${id}')">❌</span>`;
        listEl.appendChild(item);
      });
      submitBtn.disabled = false;
    }
  }

  function registerId(id) {
    if (!id) return;
    const match = String(id).match(/\d{4,12}/);
    const cleanId = match ? match[0] : String(id).trim();

    if (!cleanId) return;

    if (attendedStudents.has(cleanId)) {
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("warning");
      return;
    }

    attendedStudents.add(cleanId);
    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    showAlert(`✅ تم تسجيل: ${cleanId}`);
    updateUI();
  }

  function addManualStudent() {
    const input = document.getElementById("manualInput");
    const val = input.value.trim();
    if (val) {
      registerId(val);
      input.value = "";
    }
    input.focus();
  }

  document.getElementById("manualInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") addManualStudent();
  });

  function removeStudent(id) {
    attendedStudents.delete(id);
    updateUI();
  }

  // 1. المسح الحي من الكاميرا
  async function startScanner() {
    try {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.QR_CODE
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

      codeReader = new ZXing.BrowserMultiFormatReader(hints);

      await codeReader.decodeFromConstraints(
        {
          audio: false,
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
        },
        'video',
        (result, err) => {
          if (result && !isCooldown) {
            registerId(result.getText());
            isCooldown = true;
            setTimeout(() => { isCooldown = false; }, 1200);
          }
        }
      );
    } catch (err) {
      console.error(err);
    }
  }

  // 2. فحص الصورة عالية الدقة (الحل المضمون 100% للبطاقات)
  async function handleImageCapture(input) {
    if (input.files && input.files[0]) {
      const file = input.files[0];
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = async () => {
        try {
          if (!codeReader) {
            codeReader = new ZXing.BrowserMultiFormatReader();
          }
          const result = await codeReader.decodeFromImageElement(img);
          if (result) {
            registerId(result.getText());
          }
        } catch (e) {
          alert("تعذر قراءة الباركود من الصورة، تأكد من وضوح خطوط البطاقة وإضاءة المكان.");
        }
      };
    }
  }

  function submitAttendance() {
    if (attendedStudents.size === 0) return;
    const data = JSON.stringify({ ids: Array.from(attendedStudents) });
    tg.sendData(data);
    tg.close();
  }

  window.onload = startScanner;
</script>

</body>
</html>
