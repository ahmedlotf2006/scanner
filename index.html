<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ماسح الحضور الذكي</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- محرك Quagga2 المخصص لباركود البطائق على أجهزة الآيفون -->
  <script src="https://unpkg.com/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; padding: 10px; text-align: center; color: #fff; }
    .container { max-width: 480px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    
    .viewport {
      position: relative; width: 100%; height: 260px; border-radius: 12px;
      overflow: hidden; background: #000; margin-bottom: 12px;
    }
    .viewport video, .viewport canvas {
      width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0;
    }
    .viewport canvas.drawingBuffer { display: none !important; }
    
    .scan-guide {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90%; height: 45%; border: 2.5px solid #22c55e; border-radius: 10px;
      box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.45); pointer-events: none; z-index: 2;
    }
    .laser {
      position: absolute; width: 100%; height: 2.5px; background: #22c55e;
      box-shadow: 0 0 10px #22c55e; animation: scanAnim 1.8s infinite ease-in-out;
    }
    @keyframes scanAnim {
      0% { top: 10%; opacity: 0.3; } 50% { top: 90%; opacity: 1; } 100% { top: 10%; opacity: 0.3; }
    }

    #toast {
      display: none; padding: 10px; border-radius: 8px; margin-bottom: 10px;
      font-weight: bold; font-size: 1rem; background: #22c55e; color: #000;
    }

    .manual-box { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1; padding: 11px; border: 1.5px solid #475569; border-radius: 8px;
      font-size: 1rem; text-align: center; outline: none; background: #0f172a; color: #fff;
    }
    .btn-add {
      background: #3b82f6; color: #fff; border: none; padding: 0 18px;
      border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    
    .counter { font-size: 1.1rem; font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
    .list-box {
      max-height: 120px; overflow-y: auto; background: #0f172a;
      border: 1px solid #334155; border-radius: 8px; padding: 6px; margin-bottom: 14px;
      text-align: right;
    }
    .student-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; border-bottom: 1px solid #1e293b; font-size: 0.95rem;
    }
    .del-btn { color: #ef4444; cursor: pointer; font-weight: bold; padding: 0 5px; }
    
    .btn-submit {
      width: 100%; padding: 14px; background: #22c55e; color: #000;
      border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:disabled { background: #64748b; color: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <div id="toast"></div>

  <div class="viewport">
    <video id="androidVideo" playsinline webkit-playsinline muted autoplay></video>
    <div class="scan-guide"><div class="laser"></div></div>
  </div>

  <div class="manual-box">
    <input type="text" id="manualInput" placeholder="أدخل الرقم الأكاديمي يدوياً..." inputmode="numeric">
    <button class="btn-add" onclick="addManualStudent()">➕ إضافة</button>
  </div>

  <div class="counter">إجمالي الحاضرين: <span id="count">0</span></div>

  <div class="list-box" id="studentsList">
    <div style="color: #64748b; text-align: center; padding: 8px;">وجّه الكاميرا نحو باركود البطاقة (مسافة شبر)</div>
  </div>

  <button id="submitBtn" class="btn-submit" onclick="submitAttendance()" disabled>✅ إنهاء واعتماد الحضور</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let attendedStudents = new Set();
  let isCooldown = false;
  let audioCtx = null;

  function playBeep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = "sine";
      osc.frequency.value = 1000;
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    } catch(e){}
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.innerText = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 1500);
  }

  function updateUI() {
    const listEl = document.getElementById("studentsList");
    const countEl = document.getElementById("count");
    const submitBtn = document.getElementById("submitBtn");

    countEl.innerText = attendedStudents.size;

    if (attendedStudents.size === 0) {
      listEl.innerHTML = `<div style="color: #64748b; text-align: center; padding: 8px;">وجّه الكاميرا نحو باركود البطاقة (مسافة شبر)</div>`;
      submitBtn.disabled = true;
    } else {
      listEl.innerHTML = "";
      attendedStudents.forEach(id => {
        const item = document.createElement("div");
        item.className = "student-item";
        item.innerHTML = `<span>🎓 الرقم: <b>${id}</b></span><span class="del-btn" onclick="removeStudent('${id}')">❌</span>`;
        listEl.appendChild(item);
      });
      submitBtn.disabled = false;
    }
  }

  function registerId(id) {
    if (!id) return;
    const match = String(id).match(/\d{4,12}/);
    const cleanId = match ? match[0] : String(id).trim();

    if (!cleanId) return;

    if (attendedStudents.has(cleanId)) {
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("warning");
      return;
    }

    attendedStudents.add(cleanId);
    playBeep();
    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    showToast(`✅ تم تسجيل: ${cleanId}`);
    updateUI();
  }

  function addManualStudent() {
    const input = document.getElementById("manualInput");
    const val = input.value.trim();
    if (val) {
      registerId(val);
      input.value = "";
    }
    input.focus();
  }

  document.getElementById("manualInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") addManualStudent();
  });

  function removeStudent(id) {
    attendedStudents.delete(id);
    updateUI();
  }

  // ==========================================
  // تشغيل المحرك المزدوج (Android + iPhone)
  // ==========================================
  async function initAttendanceScanner() {
    // 1. نظام أندرويد (المحرك العتادي الشغال حالياً بدون أي تغيير)
    if ('BarcodeDetector' in window) {
      const video = document.getElementById("androidVideo");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        const detector = new BarcodeDetector({
          formats: ['code_128', 'code_39', 'ean_13', 'qr_code']
        });

        async function androidLoop() {
          if (!isCooldown && video.readyState >= 2) {
            try {
              const barcodes = await detector.detect(video);
              if (barcodes.length > 0) {
                registerId(barcodes[0].rawValue);
                isCooldown = true;
                setTimeout(() => { isCooldown = false; }, 1200);
              }
            } catch(e){}
          }
          requestAnimationFrame(androidLoop);
        }
        androidLoop();
      } catch (err) {
        document.querySelector(".viewport").innerHTML = 
          `<div style="color:#ef4444; padding:40px; font-weight:bold;">يرجى تفعيل صلاحية الكاميرا.</div>`;
      }
      return;
    }

    // 2. نظام آيفون (Quagga2 المتخصص في خطوط الباركود 1D)
    const androidVideo = document.getElementById("androidVideo");
    if (androidVideo) androidVideo.remove(); // إزالة الفيديو الافتراضي ليعمل مشغل آيفون بدقة

    if (typeof Quagga === "undefined") {
      document.querySelector(".viewport").innerHTML = 
        `<div style="color:#ef4444; padding:40px; font-weight:bold;">تعذر تحميل محرك المسح، تأكد من اتصال الإنترنت.</div>`;
      return;
    }

    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('.viewport'),
        constraints: {
          facingMode: "environment"
        }
      },
      numOfWorkers: 0, // تشغيل متزامن لمنع الحظر الأمني في Safari
      locate: true,
      locator: {
        patchSize: "medium",
        halfSample: true
      },
      decoder: {
        readers: [
          "code_128_reader",
          "code_39_reader"
        ]
      }
    }, function(err) {
      if (err) {
        document.querySelector(".viewport").innerHTML = 
          `<div style="color:#ef4444; padding:40px; font-weight:bold;">يرجى منح إذن الكاميرا لتطبيق تيليجرام في إعدادات الآيفون.</div>`;
        return;
      }
      Quagga.start();
    });

    Quagga.onDetected(function(result) {
      if (!isCooldown && result && result.codeResult && result.codeResult.code) {
        registerId(result.codeResult.code);
        isCooldown = true;
        setTimeout(() => { isCooldown = false; }, 1200);
      }
    });
  }

  function submitAttendance() {
    if (attendedStudents.size === 0) return;
    const data = JSON.stringify({ ids: Array.from(attendedStudents) });
    tg.sendData(data);
    tg.close();
  }

  window.onload = initAttendanceScanner;
</script>

</body>
</html>
