<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ماسح الحضور الجامعي</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; padding: 10px; text-align: center; color: #fff; }
    .container { max-width: 480px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 14px; }
    
    #reader {
      width: 100%; border-radius: 12px; overflow: hidden; background: #000;
      margin-bottom: 12px; min-height: 250px;
    }
    #reader video { object-fit: cover !important; border-radius: 12px; }

    #toast {
      display: none; padding: 10px; border-radius: 8px; margin-bottom: 10px;
      font-weight: bold; font-size: 1rem; background: #22c55e; color: #000;
    }

    .manual-box { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1; padding: 11px; border: 1.5px solid #475569; border-radius: 8px;
      font-size: 1rem; text-align: center; outline: none; background: #0f172a; color: #fff;
    }
    .btn-add {
      background: #3b82f6; color: #fff; border: none; padding: 0 18px;
      border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    
    .counter { font-size: 1.1rem; font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
    .list-box {
      max-height: 120px; overflow-y: auto; background: #0f172a;
      border: 1px solid #334155; border-radius: 8px; padding: 6px; margin-bottom: 14px;
      text-align: right;
    }
    .student-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; border-bottom: 1px solid #1e293b; font-size: 0.95rem;
    }
    .del-btn { color: #ef4444; cursor: pointer; font-weight: bold; padding: 0 5px; }
    
    .btn-submit {
      width: 100%; padding: 14px; background: #22c55e; color: #000;
      border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:disabled { background: #64748b; color: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <div id="toast"></div>

  <!-- حاوية الكاميرا -->
  <div id="reader"></div>

  <div class="manual-box">
    <input type="text" id="manualInput" placeholder="أدخل الرقم الأكاديمي (١٢٣ أو 123)...">
    <button class="btn-add" onclick="addManualStudent()">➕ إضافة</button>
  </div>

  <div class="counter">إجمالي الحاضرين: <span id="count">0</span></div>

  <div class="list-box" id="studentsList">
    <div style="color: #64748b; text-align: center; padding: 8px;">وجّه الكاميرا نحو باركود البطاقة مباشرة</div>
  </div>

  <button id="submitBtn" class="btn-submit" onclick="submitAttendance()" disabled>✅ إنهاء واعتماد الحضور</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let attendedStudents = new Set();
  let isCooldown = false;
  let html5QrCode = null;

  function toStandardDigits(str) {
    if (!str) return "";
    return String(str).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.innerText = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 1500);
  }

  function updateUI() {
    const listEl = document.getElementById("studentsList");
    const countEl = document.getElementById("count");
    const submitBtn = document.getElementById("submitBtn");

    countEl.innerText = attendedStudents.size;

    if (attendedStudents.size === 0) {
      listEl.innerHTML = `<div style="color: #64748b; text-align: center; padding: 8px;">وجّه الكاميرا نحو باركود البطاقة مباشرة</div>`;
      submitBtn.disabled = true;
    } else {
      listEl.innerHTML = "";
      attendedStudents.forEach(id => {
        const item = document.createElement("div");
        item.className = "student-item";
        item.innerHTML = `<span>🎓 الرقم: <b>${id}</b></span><span class="del-btn" onclick="removeStudent('${id}')">❌</span>`;
        listEl.appendChild(item);
      });
      submitBtn.disabled = false;
    }
  }

  function registerId(id) {
    if (!id) return;
    const standardStr = toStandardDigits(String(id));
    const match = standardStr.match(/\d{4,12}/);
    const cleanId = match ? match[0] : standardStr.trim();

    if (!cleanId) return;

    if (attendedStudents.has(cleanId)) {
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("warning");
      return;
    }

    attendedStudents.add(cleanId);
    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    showToast(`✅ تم تسجيل: ${cleanId}`);
    updateUI();
  }

  function addManualStudent() {
    const input = document.getElementById("manualInput");
    const val = input.value.trim();
    if (val) {
      registerId(val);
      input.value = "";
    }
    input.focus();
  }

  document.getElementById("manualInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") addManualStudent();
  });

  function removeStudent(id) {
    attendedStudents.delete(id);
    updateUI();
  }

  function startScanner() {
    const formatsToSupport = [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.QR_CODE
    ];

    html5QrCode = new Html5Qrcode("reader", {
      formatsToSupport: formatsToSupport,
      verbose: false,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });

    const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
      return {
        width: Math.floor(viewfinderWidth * 0.88),
        height: Math.floor(viewfinderHeight * 0.45)
      };
    };

    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 20, qrbox: qrboxFunction },
      (decodedText) => {
        if (!isCooldown) {
          registerId(decodedText);
          isCooldown = true;
          setTimeout(() => { isCooldown = false; }, 1200);
        }
      },
      (errorMessage) => {}
    ).catch((err) => {
      document.getElementById("reader").innerHTML = 
        `<div style="color:#ef4444; padding:30px; font-weight:bold;">يرجى منح تطبيق تيليجرام صلاحية الكاميرا من إعدادات الجوال.</div>`;
    });
  }

  function submitAttendance() {
    if (attendedStudents.size === 0) return;
    const data = JSON.stringify({ ids: Array.from(attendedStudents) });
    tg.sendData(data);
    tg.close();
  }

  window.onload = startScanner;
</script>

</body>
</html>
