<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الماسح الذكي</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; padding: 12px; text-align: center; }
    .container { max-width: 450px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    
    #reader { width: 100%; border-radius: 10px; overflow: hidden; background: #000; margin-bottom: 12px; min-height: 240px; }
    
    #status-alert {
      display: none; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; font-size: 0.95rem;
      background: #d4edda; color: #155724; border: 1px solid #c3e6cb;
    }

    .manual-box { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1; padding: 12px; border: 1.5px solid #dcdfe6; border-radius: 8px;
      font-size: 1.05rem; text-align: center; outline: none;
    }
    input[type="text"]:focus { border-color: #1f4e79; }
    .btn-add {
      background: #1f4e79; color: #fff; border: none; padding: 0 18px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;
    }
    
    .counter { font-size: 1.1rem; font-weight: bold; color: #1f4e79; margin-bottom: 10px; }
    .list-box {
      max-height: 120px; overflow-y: auto; background: #fafafa;
      border: 1px solid #ebeef5; border-radius: 8px; padding: 6px; margin-bottom: 14px;
      text-align: right;
    }
    .student-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 0.95rem;
    }
    .del-btn { color: #d32f2f; cursor: pointer; font-weight: bold; padding: 0 5px; }
    
    .btn-submit {
      width: 100%; padding: 14px; background: #2e7d32; color: #fff;
      border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold;
      cursor: pointer; box-shadow: 0 3px 8px rgba(46,125,50,0.3);
    }
    .btn-submit:disabled { background: #b0bec5; cursor: not-allowed; box-shadow: none; }
  </style>
</head>
<body>

<div class="container">
  <div id="status-alert"></div>
  
  <div id="reader"></div>

  <div class="manual-box">
    <input type="text" id="manualInput" placeholder="أدخل الرقم الأكاديمي يدوياً..." inputmode="numeric">
    <button class="btn-add" onclick="addManualStudent()">➕ إضافة</button>
  </div>

  <div class="counter">إجمالي الحاضرين: <span id="count">0</span></div>

  <div class="list-box" id="studentsList">
    <div style="color: #909399; text-align: center; padding: 8px;">لم يُسجل أي طالب بعد</div>
  </div>

  <button id="submitBtn" class="btn-submit" onclick="submitAttendance()" disabled>✅ إنهاء واعتماد الحضور</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let attendedStudents = new Set();
  let isCooldown = false;
  let html5Qr;

  function showAlert(msg) {
    const el = document.getElementById("status-alert");
    el.innerText = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 1800);
  }

  function updateUI() {
    const listEl = document.getElementById("studentsList");
    const countEl = document.getElementById("count");
    const submitBtn = document.getElementById("submitBtn");

    countEl.innerText = attendedStudents.size;

    if (attendedStudents.size === 0) {
      listEl.innerHTML = `<div style="color: #909399; text-align: center; padding: 8px;">لم يُسجل أي طالب بعد</div>`;
      submitBtn.disabled = true;
    } else {
      listEl.innerHTML = "";
      attendedStudents.forEach(id => {
        const item = document.createElement("div");
        item.className = "student-item";
        item.innerHTML = `<span>🎓 الرقم: <b>${id}</b></span><span class="del-btn" onclick="removeStudent('${id}')">❌</span>`;
        listEl.appendChild(item);
      });
      submitBtn.disabled = false;
    }
  }

  function registerId(id) {
    const cleanId = String(id).trim();
    if (!cleanId) return;

    if (attendedStudents.has(cleanId)) {
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("warning");
      return;
    }

    attendedStudents.add(cleanId);
    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    showAlert(`✅ تم تسجيل الرقم: ${cleanId}`);
    updateUI();
  }

  function addManualStudent() {
    const input = document.getElementById("manualInput");
    const val = input.value.trim();
    if (val) {
      registerId(val);
      input.value = "";
    }
    input.focus();
  }

  document.getElementById("manualInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") addManualStudent();
  });

  function removeStudent(id) {
    attendedStudents.delete(id);
    updateUI();
  }

  function onScanSuccess(decodedText) {
    if (isCooldown) return;

    const match = decodedText.match(/\d{4,12}/);
    const sid = match ? match[0] : decodedText.trim();

    registerId(sid);

    isCooldown = true;
    setTimeout(() => { isCooldown = false; }, 1200);
  }

  function startCamera() {
    // تفعيل قراءة الباركود الخطي للبطائق الجامعية
    const formatsToSupport = [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.QR_CODE
    ];

    html5Qr = new Html5Qrcode("reader", {
      formatsToSupport: formatsToSupport,
      verbose: false,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });

    // إطار عريض يناسب خطوط الباركود الأفقية بالكامل
    const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
      return {
        width: Math.floor(viewfinderWidth * 0.90),
        height: Math.floor(viewfinderHeight * 0.45)
      };
    };

    html5Qr.start(
      { facingMode: "environment" },
      { fps: 25, qrbox: qrboxFunction },
      onScanSuccess,
      (err) => {}
    ).catch(err => {
      document.getElementById("reader").innerHTML = `<div style="color:red; padding:15px;">يرجى تفعيل صلاحية الكاميرا.</div>`;
    });
  }

  function submitAttendance() {
    if (attendedStudents.size === 0) return;
    const data = JSON.stringify({ ids: Array.from(attendedStudents) });
    tg.sendData(data);
    tg.close();
  }

  window.onload = startCamera;
</script>

</body>
</html>
