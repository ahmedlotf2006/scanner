<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الماسح الذكي للدفعة</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; padding: 12px; text-align: center; }
    .container { max-width: 460px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    
    /* زر الماسح المباشر فائق السرعة */
    .btn-native {
      width: 100%; padding: 13px; background: #0088cc; color: #fff; border: none;
      border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer;
      margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 3px 8px rgba(0,136,204,0.3);
    }

    #reader { width: 100%; border-radius: 10px; overflow: hidden; background: #000; margin-bottom: 10px; min-height: 220px; }
    
    #status-alert {
      display: none; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; font-size: 0.95rem;
      background: #d4edda; color: #155724; border: 1px solid #c3e6cb;
    }

    .manual-box { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1; padding: 11px; border: 1.5px solid #dcdfe6; border-radius: 8px;
      font-size: 1rem; text-align: center; outline: none;
    }
    input[type="text"]:focus { border-color: #1f4e79; }
    .btn-add {
      background: #1f4e79; color: #fff; border: none; padding: 0 16px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem;
    }
    
    .counter { font-size: 1.1rem; font-weight: bold; color: #1f4e79; margin-bottom: 8px; }
    .list-box {
      max-height: 120px; overflow-y: auto; background: #fafafa;
      border: 1px solid #ebeef5; border-radius: 8px; padding: 6px; margin-bottom: 12px;
      text-align: right;
    }
    .student-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 0.95rem;
    }
    .del-btn { color: #d32f2f; cursor: pointer; font-weight: bold; padding: 0 5px; }
    
    .btn-submit {
      width: 100%; padding: 14px; background: #2e7d32; color: #fff;
      border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold;
      cursor: pointer; box-shadow: 0 3px 8px rgba(46,125,50,0.3);
    }
    .btn-submit:disabled { background: #b0bec5; cursor: not-allowed; box-shadow: none; }
  </style>
</head>
<body>

<div class="container">
  <div id="status-alert"></div>

  <!-- زر فتح كاميرا تيليجرام المباشرة الرسمية -->
  <button class="btn-native" onclick="openTelegramNativeScanner()">⚡ تشغيل ماسح تيليجرام المباشر (سريع جداً)</button>

  <!-- نافذة الكاميرا داخل الصفحة كخيار احتياطي ومستمر -->
  <div id="reader"></div>

  <!-- الإدخال اليدوي -->
  <div class="manual-box">
    <input type="text" id="manualInput" placeholder="أدخل الرقم الأكاديمي يدوياً..." inputmode="numeric">
    <button class="btn-add" onclick="addManualStudent()">➕ إضافة</button>
  </div>

  <div class="counter">إجمالي الحاضرين: <span id="count">0</span></div>

  <div class="list-box" id="studentsList">
    <div style="color: #909399; text-align: center; padding: 8px;">لم يُسجل أي طالب بعد</div>
  </div>

  <button id="submitBtn" class="btn-submit" onclick="submitAttendance()" disabled>✅ إنهاء واعتماد الحضور</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let attendedStudents = new Set();
  let isCooldown = false;
  let html5Qr;

  function showAlert(msg) {
    const el = document.getElementById("status-alert");
    el.innerText = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 1800);
  }

  function updateUI() {
    const listEl = document.getElementById("studentsList");
    const countEl = document.getElementById("count");
    const submitBtn = document.getElementById("submitBtn");

    countEl.innerText = attendedStudents.size;

    if (attendedStudents.size === 0) {
      listEl.innerHTML = `<div style="color: #909399; text-align: center; padding: 8px;">لم يُسجل أي طالب بعد</div>`;
      submitBtn.disabled = true;
    } else {
      listEl.innerHTML = "";
      attendedStudents.forEach(id => {
        const item = document.createElement("div");
        item.className = "student-item";
        item.innerHTML = `<span>🎓 الرقم: <b>${id}</b></span><span class="del-btn" onclick="removeStudent('${id}')">❌</span>`;
        listEl.appendChild(item);
      });
      submitBtn.disabled = false;
    }
  }

  function registerId(id) {
    if (!id) return;
    const match = String(id).match(/\d{4,12}/);
    const cleanId = match ? match[0] : String(id).trim();

    if (!cleanId) return;

    if (attendedStudents.has(cleanId)) {
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("warning");
      return;
    }

    attendedStudents.add(cleanId);
    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    showAlert(`✅ تم تسجيل: ${cleanId}`);
    updateUI();
  }

  // 1. تشغيل ماسح تيليجرام المدمج (Native Scanner)
  function openTelegramNativeScanner() {
    if (tg.showScanQrPopup) {
      tg.showScanQrPopup({ text: "وجّه الكاميرا نحو باركود بطاقة الطالب" }, function(scannedText) {
        registerId(scannedText);
        return true; // إغلاق الماسح فور التقاط الكود
      });
    } else {
      alert("خاصية الماسح المدمج غير متوفرة، استخدم كاميرا الصفحة أدناه.");
    }
  }

  // 2. الإدخال اليدوي
  function addManualStudent() {
    const input = document.getElementById("manualInput");
    const val = input.value.trim();
    if (val) {
      registerId(val);
      input.value = "";
    }
    input.focus();
  }

  document.getElementById("manualInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") addManualStudent();
  });

  function removeStudent(id) {
    attendedStudents.delete(id);
    updateUI();
  }

  // 3. كاميرا الصفحة المدعومة بكاشف الأجهزة
  function onScanSuccess(decodedText) {
    if (isCooldown) return;
    registerId(decodedText);
    isCooldown = true;
    setTimeout(() => { isCooldown = false; }, 1000);
  }

  function startCamera() {
    html5Qr = new Html5Qrcode("reader");

    // إعدادات البث بجودة عالية لتوضيح خطوط الباركود الدقيقة
    const cameraConfig = {
      fps: 25,
      aspectRatio: 1.333334
    };

    html5Qr.start(
      { facingMode: { exact: "environment" } },
      cameraConfig,
      onScanSuccess,
      (err) => {}
    ).catch(() => {
      // محاولة بديلة إذا كان الهاتف لا يدعم exact environment
      html5Qr.start(
        { facingMode: "environment" },
        cameraConfig,
        onScanSuccess,
        (err) => {}
      ).catch(e => {
        document.getElementById("reader").innerHTML = `<div style="color:#666; padding:15px;">استخدم زر "تشغيل ماسح تيليجرام المباشر" بالأعلى.</div>`;
      });
    });
  }

  function submitAttendance() {
    if (attendedStudents.size === 0) return;
    const data = JSON.stringify({ ids: Array.from(attendedStudents) });
    tg.sendData(data);
    tg.close();
  }

  window.onload = startCamera;
</script>

</body>
</html>
